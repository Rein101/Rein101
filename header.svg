<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rein&apos;s Hub — the Rein101 catalogue">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edb45a"/>
      <stop offset="1" stop-color="#5cc98e"/>
    </linearGradient>
    <radialGradient id="key" cx="0.72" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#edb45a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#edb45a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <symbol id="daisy" viewBox="0 0 100 100">
    <g fill="currentColor"><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(0.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(40.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(80.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(120.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(160.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(200.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(240.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(280.0 50 50)"/><ellipse cx="50" cy="28" rx="12.5" ry="24" transform="rotate(320.0 50 50)"/><circle cx="50" cy="50" r="15.5"/></g>
  </symbol>

  <rect width="1200" height="300" fill="#0d100c"/>
  <rect width="1200" height="300" fill="url(#key)"/>
  <rect width="1200" height="300" fill="url(#beam)"/>

